<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 · 案例复现</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container" aria-label="作业导航">
      <a class="brand" href="case.html">个人主页</a>
      <div class="nav-links"><a href="../index.html">作业目录</a><a href="index.html">自主实践</a></div>
    </nav>
  </header>
  <main class="container">
    <p class="eyebrow">课堂作业 01 · 案例复现</p>
    <h1>欢迎来到我的个人主页</h1>
    <section class="panel">
      <h2>关于我</h2>
      <p>姓名：________　学号：________</p>
      <p>这是一个 HTML 个人主页案例，使用标题、段落、列表、链接和图片展示个人学习信息。</p>
      <figure class="profile-image">
        <img src="../shared/study-room.jpg" alt="校园学习空间示意图，用于个人主页的图片练习" width="960" height="640">
        <figcaption>我的校园学习环境（示意）</figcaption>
      </figure>
    </section>
    <section class="panel">
      <h2>兴趣与学习目标</h2>
      <ul><li>阅读与资料整理</li><li>网页设计与前端编程</li><li>运动与校园生活</li></ul>
      <p>本阶段的目标是掌握 HTML 基本结构，理解元素之间的层级关系，并使用 Git 记录网页修改过程。</p>
    </section>
    <section class="panel resources">
      <h2>常用学习链接</h2>
      <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML" target="_blank" rel="noopener noreferrer">HTML 学习文档 ↗</a>
      <a href="https://git-scm.com/doc">Git 官方文档</a>
      <a href="https://github.com/">GitHub</a>
    </section>
  </main>
  <footer class="container">个人主页案例 · 姓名与学号待本人填写</footer>
</body>
</html>
