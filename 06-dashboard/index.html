<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自习室统计看板 · 作业六</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a href="../index.html">← 作业目录</a><nav aria-label="本作业导航"><a href="case.html">图书案例</a><a href="../07-3d/index.html">三维自习室 →</a></nav></header>
  <main>
    <div class="intro"><div><p class="eyebrow">06 / 数据可视化</p><h1>自习室统计看板</h1><p class="subtitle">看看哪里还有空座，以及一天中的使用变化。</p></div><span class="badge">演示数据 · 22:00快照</span></div>
    <div class="toolbar"><label for="floor">查看楼层</label><select id="floor"><option value="all">全部楼层</option><option value="1">一楼</option><option value="2">二楼</option></select><button id="reload" type="button">重新加载</button></div>
    <p id="status" class="status" role="status" aria-live="polite">正在加载数据……</p>
    <div id="content" hidden>
      <section class="stats" aria-label="统计摘要">
        <article><span>可用座位</span><strong id="available">—</strong><small>个</small></article>
        <article><span>当前使用人数</span><strong id="occupied">—</strong><small>人</small></article>
        <article><span>座位使用率</span><strong id="rate">—</strong><small>%</small></article>
      </section>
      <section class="charts" aria-label="统计图表">
        <article class="chart-card"><h2>各自习室当前人数</h2><p>单位：人 · 移动到柱形可查看详情</p><div id="room-chart" class="chart" role="img" aria-label="各自习室当前人数柱形图"></div></article>
        <article class="chart-card"><h2>全天使用人数趋势</h2><p>单位：人 · 08:00—22:00</p><div class="chart"><canvas id="trend-chart" role="img" aria-label="全天使用人数折线图"></canvas></div></article>
      </section>
      <p id="source" class="source"></p>
    </div>
    <footer>状态演示：<a href="index.html">正常数据</a> · <a href="index.html?state=empty">空数据</a> · <a href="index.html?state=error">请求失败</a></footer>
  </main>
  <script src="../vendor/jquery.min.js"></script>
  <script src="../vendor/echarts.min.js"></script>
  <script src="../vendor/chart.umd.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
