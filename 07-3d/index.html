<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三维自习室 · 作业七</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body>
  <header class="topbar"><a href="../index.html">← 作业目录</a><nav aria-label="本作业导航"><a href="case-three.html">Three.js案例</a><a href="case-aframe.html">A-Frame案例</a><a href="../06-dashboard/index.html">统计看板</a></nav></header>
  <main>
    <p class="eyebrow">07 / 三维交互</p><h1>走进静心自习室</h1>
    <p class="subtitle">用基础几何体搭建桌椅、书架和台灯，预览空间布局。</p>
    <div class="controls"><button id="pause" type="button" aria-pressed="false">暂停动画</button><button id="color" type="button">切换书架配色</button><button id="reset" type="button">恢复视角</button><span>拖动旋转 · 滚轮缩放 · 右键平移 · 方向键平移</span></div>
    <div id="stage" class="stage"><p id="render-status" class="status" role="status" aria-live="polite">正在加载三维自习室……</p></div>
    <div class="legend"><span><i class="dot"></i>原木学习桌</span><span><i class="dot green"></i>绿色座椅与书架</span><span><i class="dot gold"></i>暖色台灯</span></div>
    <footer>桌椅、书架、书本、绿植均由代码生成，无需下载模型。台灯有缓慢的亮度动画。</footer>
    <noscript>请启用JavaScript以查看三维场景。</noscript>
  </main>
  <script type="module">
    import('./room.js').catch(error => {
      const status = document.getElementById('render-status');
      status.hidden = false;
      status.classList.add('error');
      status.textContent = `场景加载失败：${error.message}。请通过HTTP服务器打开，并确认浏览器支持WebGL。`;
    });
  </script>
</body>
</html>
