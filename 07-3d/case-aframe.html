<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园漫游 · A-Frame案例</title>
  <link rel="stylesheet" href="style.css">
  <script src="../vendor/aframe.min.js"></script>
</head>
<body>
  <header class="topbar"><a href="../index.html">← 作业目录</a><nav><a href="case-three.html">Three.js案例</a><a href="index.html">自主作品 →</a></nav></header>
  <main>
    <p class="eyebrow">07 / A-FRAME 案例复现</p><h1>校园漫游</h1>
    <p class="subtitle">天空、草地、教学楼与小路，加入飘动旗帜和脉动路灯。</p>
    <div class="controls"><button id="reset" type="button">回到入口</button><button id="pause" type="button" aria-pressed="false">暂停动画</button><span>在画面中拖动查看 · 使用WASD或方向键移动</span></div>
    <div id="stage" class="stage">
      <p id="render-status" class="status" role="status" aria-live="polite">正在加载校园场景……</p>
      <a-scene embedded xr-mode-ui="enabled: false" loading-screen="enabled: false" renderer="antialias: true; colorManagement: true">
        <a-sky color="#cde5ef"></a-sky>
        <a-plane rotation="-90 0 0" width="70" height="70" color="#7ca86a"></a-plane>
        <a-box position="0 0.025 -3" width="4" height="0.05" depth="30" color="#d8cdb4"></a-box>
        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 1.2" position="-5 12 8"></a-entity>
        <a-entity id="building">
          <a-box position="0 3.5 -13" width="12" height="7" depth="4" color="#e5d9bb"></a-box>
          <a-box position="0 7.15 -13" width="12.5" height="0.3" depth="4.5" color="#49735e"></a-box>
          <a-box position="0 1.3 -10.95" width="2.2" height="2.6" depth="0.12" color="#4b776c"></a-box>
          <a-box position="0 3.05 -10.8" width="3.8" height="0.25" depth="1.2" color="#49735e"></a-box>
        </a-entity>
        <a-entity position="-4 0 -5.5">
          <a-cylinder position="0 2.5 0" radius="0.06" height="5" color="#d4d8d6"></a-cylinder>
          <a-entity id="flag" position="0 4.3 0" animation="property: rotation; from: 0 -16 -4; to: 0 16 4; dir: alternate; dur: 1700; easing: easeInOutSine; loop: true; pauseEvents: pause-motion; resumeEvents: resume-motion">
            <a-plane position="0.85 0 0" width="1.7" height="0.9" color="#b84e43" material="side: double"></a-plane>
          </a-entity>
        </a-entity>
        <a-entity id="lamp" position="4 0 -4">
          <a-cylinder position="0 1.75 0" radius="0.09" height="3.5" color="#405c4e"></a-cylinder>
          <a-sphere id="lamp-globe" position="0 3.65 0" radius="0.3" color="#fff0b5" material="shader: flat" animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; dur: 1600; easing: easeInOutSine; loop: true; pauseEvents: pause-motion; resumeEvents: resume-motion"></a-sphere>
          <a-entity id="lamp-light" position="0 3.5 0" light="type: point; color: #ffe2a3; intensity: 2; distance: 8" animation="property: light.intensity; from: 2; to: 4; dir: alternate; dur: 1600; easing: easeInOutSine; loop: true; pauseEvents: pause-motion; resumeEvents: resume-motion"></a-entity>
        </a-entity>
        <a-entity id="trees"></a-entity>
        <a-entity id="camera" camera position="0 1.7 10" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 22"></a-entity>
      </a-scene>
    </div>
    <footer>基于A-Frame的HTML实体与animation组件构建，无外部模型和纹理。</footer>
  </main>
  <script src="case-aframe.js"></script>
</body>
</html>
